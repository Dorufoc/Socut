name: package-win

# M12：Windows 安装包（手动触发）。
# 产物：release/*.exe + last-package.json（SHA256/体积）；可选跑安装冒烟（--verify）。
# 注意：Windows 构建未签名（见 CODE_SIGNING 计划），SmartScreen 会提示「更多信息 → 仍要运行」。
on:
  workflow_dispatch:
    inputs:
      verify:
        description: '打包后跑安装/升级/卸载冒烟（verify-packaged.ps1）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Cache bundled resources
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/fonts
            resources/models/matte
            resources/models/rnnoise
          key: socut-resources-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/fetch-fonts.mjs', 'scripts/fetch-matte-model.mjs', 'scripts/fetch-rnnoise-model.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap resources
        run: node scripts/ci-bootstrap.mjs

      - name: Build installer
        shell: pwsh
        run: |
          if ('${{ inputs.verify }}' -eq 'true') {
            npm run package:win -- --verify
          } else {
            npm run package:win
          }

      - name: Smoke packaged AI runtime (asar + native ORT + model)
        run: npm run smoke:packaged:ai

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: socut-win
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/last-package.json
          retention-days: 14
