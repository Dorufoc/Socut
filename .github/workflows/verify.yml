name: verify

# M12：把 M5–M11 的成果锁进 CI。
# 说明：
# - 仓库不提交二进制资源（FFmpeg 201MB / 字体），CI 用缓存 + fetch 脚本补齐；
# - 本工作流只跑"确定性"检查（check-env / lint / typecheck / vitest / 生产构建），
#   不跑需要真实桌面 UI 的 verify:all 场景（那是 nightly 的人工/机器冒烟）；
# - 像素/编码测试会自己检测随包 FFmpeg 的编码器，缺 libx265 等时自动跳过（不假绿）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Cache bundled resources (FFmpeg + fonts)
        id: resources
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/fonts
            resources/models/matte
            resources/models/rnnoise
          key: socut-resources-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/fetch-fonts.mjs', 'scripts/fetch-matte-model.mjs', 'scripts/fetch-rnnoise-model.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap resources
        run: node scripts/ci-bootstrap.mjs

      - name: Verify (check-env + lint + typecheck + tests + build)
        run: npm run verify:ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-artifacts
          if-no-files-found: ignore
          path: |
            spikes/verify-all.json
            spikes/artifacts/**
            out/**
          retention-days: 7
